[PHP]
upload_max_filesize = 2G
post_max_size = 2G
max_execution_time = 1200
session.gc_maxlifetime = 1440
display_errors = Off
max_input_time = 600
max_input_vars = 1000
memory_limit = 16G
session.save_path = "/var/cpanel/php/sessions/alt-php71"
zlib.output_compression = Off
